# =============================================================================
# PostgreSQL Client Authentication — remote-accessible, NO AUTH (trust).
# Bind-mount from ./conf/pg_hba.conf to /etc/postgresql/pg_hba.conf.
#
# WARNING: `trust` skips password checking entirely. Only safe for trusted
# LAN / internal test environments. Do NOT expose 5432 to the public
# internet without switching to `scram-sha-256` + a real password.
# =============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# --- Local Unix socket (container internal) -----------------------------------
local   all             all                                     trust

# --- Localhost (loopback) ------------------------------------------------------
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# --- Remote access: any host, any DB, any user, no password -------------------
host    all             all             0.0.0.0/0               trust
host    all             all             ::0/0                   trust

# --- Replication (only if you ever set up replicas) ---------------------------
# local   replication     all                                     trust
# host    replication     all             127.0.0.1/32            trust
# host    replication     all             ::1/128                 trust