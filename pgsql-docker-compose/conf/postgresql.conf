# =============================================================================
# PostgreSQL 16 configuration — single instance, remote-accessible, NO AUTH.
# Bind-mount from ./conf/postgresql.conf to /etc/postgresql/postgresql.conf.
# Only the values we override from the image default are listed below.
# =============================================================================

# ---- Connection & Authentication ---------------------------------------------
# Listen on every interface so the service is reachable from other hosts.
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3
unix_socket_directories = '/var/run/postgresql'

# ---- Memory ------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 128MB
huge_pages = try

# ---- WAL & Checkpoint --------------------------------------------------------
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB

# ---- Query Planner -----------------------------------------------------------
random_page_cost = 1.1          # SSD storage
effective_io_concurrency = 200

# ---- Logging -----------------------------------------------------------------
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql.log'
log_rotation_age = 1d
log_rotation_size = 50MB
log_truncate_on_rotation = on
log_min_duration_statement = 1000  # log queries > 1s
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d from %h '

# ---- Locale & Format ---------------------------------------------------------
timezone = 'Asia/Shanghai'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# ---- Client Connection Defaults ----------------------------------------------
client_encoding = 'UTF8'