# =============================================================================
# Redis 7.2 configuration — single instance, remote-accessible, NO AUTH.
# Bind-mount from ./conf/redis.conf to /usr/local/etc/redis/redis.conf (ro).
# daemonize no because Docker manages the foreground process.
# =============================================================================

# ---- Network -----------------------------------------------------------------
# Listen on every interface so the service is reachable from other hosts.
bind 0.0.0.0 -::*
# Protected mode refuses external traffic unless auth is set OR bind is 127.0.0.1.
# Since we explicitly want remote access without auth, disable protected mode.
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---- General -----------------------------------------------------------------
daemonize no
loglevel notice
logfile /var/log/redis/redis.log
databases 16
always-show-logo no

# ---- Snapshotting (RDB) ------------------------------------------------------
# Save snapshots when keys change enough within the time window.
# Production-tuned defaults; comment out for cache-only workloads.
save 3600 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
# RDB/AOF files go to the data dir (/data by default inside the container).
dir /data

# ---- Append Only File (AOF) --------------------------------------------------
# Disabled by default for cache-only use. Flip to "yes" if you need stronger
# durability at the cost of write IO.
appendonly no
# appendfsync everysec
# no-appendfsync-on-rewrite no
# aof-use-rdb-preamble yes

# ---- Memory management -------------------------------------------------------
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ---- Lazy freeing ------------------------------------------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ---- Slow log ----------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---- Event notification (disabled by default; cheap to enable for ops) -------
notify-keyspace-events ""

# ---- Client output buffer & query cache ---------------------------------------
# Reasonable defaults; tune per workload.